name: Extract PulseHUD source zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip to repo root
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f PulseHUD-Android-Source.zip ]; then
            echo "Zip file not found in repo root"
            exit 1
          fi

          unzip -q PulseHUD-Android-Source.zip

          if [ -d PulseHUD ]; then
            shopt -s dotglob nullglob
            for item in PulseHUD/*; do
              mv "$item" .
            done
            rm -rf PulseHUD
          else
            echo "Expected extracted folder 'PulseHUD' not found"
            exit 1
          fi

      - name: Commit extracted files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Extract PulseHUD source into repo root"
          git push
